<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Downloader</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom loader animation */
        .loader {
            border: 3px solid #f3f4f6;
            border-bottom-color: #4f46e5;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans text-gray-900">

    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- Header -->
        <div class="bg-indigo-600 px-8 py-10 text-center">
            <h1 class="text-3xl font-bold text-white mb-2">Universal Video Downloader</h1>
            <p class="text-indigo-100">Download videos from YouTube and Instagram just by pasting the link.</p>
        </div>

        <!-- Content -->
        <div class="p-8">
            <form id="downloadForm" class="space-y-4">
                <div>
                    <label for="url" class="sr-only">Video URL</label>
                    <input 
                        type="url" 
                        id="url" 
                        name="url" 
                        required 
                        placeholder="Paste video link here (e.g., https://youtube.com/watch?v=...)"
                        class="w-full px-4 py-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors placeholder-gray-400 outline-none"
                    >
                </div>
                
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition-colors flex items-center justify-center gap-2 disabled:bg-indigo-400 disabled:cursor-not-allowed"
                >
                    <span id="btnText">Get Download Link</span>
                    <span id="btnLoader" class="loader w-5 h-5 hidden"></span>
                </button>
            </form>

            <!-- Error Message Container -->
            <div id="errorContainer" class="mt-6 p-4 bg-red-50 text-red-700 rounded-xl flex items-start gap-3 border border-red-100 hidden">
                <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p id="errorMessage" class="text-sm font-medium"></p>
            </div>

            <!-- Result Container -->
            <div id="resultContainer" class="mt-8 border border-gray-200 rounded-xl overflow-hidden bg-gray-50 hidden">
                <div class="aspect-video w-full relative bg-black hidden" id="thumbnailContainer">
                    <img id="videoThumbnail" src="" alt="Video thumbnail" class="w-full h-full object-contain">
                </div>
                <div class="p-6">
                    <h3 id="videoTitle" class="font-semibold text-gray-900 text-lg mb-6 line-clamp-2" title=""></h3>
                    <a 
                        id="downloadLink" 
                        href="#" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        class="w-full py-3 px-6 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl transition-colors flex items-center justify-center gap-2"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download Video
                    </a>
                    <p class="text-xs text-center text-gray-500 mt-4">
                        Right-click and select "Save video as..." if it opens in a new tab.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('downloadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const urlInput = document.getElementById('url').value.trim();
            if (!urlInput) return;

            // UI Elements
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const errorContainer = document.getElementById('errorContainer');
            const errorMessage = document.getElementById('errorMessage');
            const resultContainer = document.getElementById('resultContainer');
            const thumbnailContainer = document.getElementById('thumbnailContainer');
            const videoThumbnail = document.getElementById('videoThumbnail');
            const videoTitle = document.getElementById('videoTitle');
            const downloadLink = document.getElementById('downloadLink');

            // Set loading state
            submitBtn.disabled = true;
            btnText.textContent = "Processing... Please wait";
            btnLoader.classList.remove('hidden');
            errorContainer.classList.add('hidden');
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch('/api/get-video', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'An unexpected error occurred');
                }

                // Update UI with success data
                if (data.thumbnail) {
                    videoThumbnail.src = data.thumbnail;
                    thumbnailContainer.classList.remove('hidden');
                } else {
                    thumbnailContainer.classList.add('hidden');
                }

                videoTitle.textContent = data.title;
                videoTitle.title = data.title;
                downloadLink.href = data.downloadUrl;
                
                resultContainer.classList.remove('hidden');

            } catch (error) {
                // Show error message
                errorMessage.textContent = error.message;
                errorContainer.classList.remove('hidden');
            } finally {
                // Reset loading state
                submitBtn.disabled = false;
                btnText.textContent = "Get Download Link";
                btnLoader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
